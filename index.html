<script>
/* ==========================================================
   MA'LUMOTLAR (DATA) — Reading / Listening / Writing savollari
   ========================================================== */
const TEST_DATA = {
  reading: {
    timeLimit: 15 * 60, // sekundlarda
    passage: `The Rise of Remote Work

Over the past decade, remote work has transformed from a rare perk into a mainstream way of working. Advances in communication technology, such as video conferencing and cloud-based collaboration tools, have made it possible for employees to perform their duties from virtually anywhere. Companies that once required staff to be physically present in an office now allow — and sometimes actively encourage — employees to work from home or from co-working spaces.

Proponents of remote work argue that it increases productivity, reduces commuting stress, and gives employees greater control over their schedules. Studies have shown that many remote workers report higher job satisfaction and a better work-life balance. Furthermore, businesses can save significant amounts of money on office space and utilities.

However, remote work is not without its drawbacks. Some employees feel isolated without daily face-to-face interaction with colleagues, which can affect team cohesion and mental well-being. Managers may also find it more challenging to monitor performance and maintain company culture when staff are scattered across different locations. Additionally, not every job can be performed remotely; industries such as manufacturing and healthcare still require a physical presence.

As organizations continue to adapt, many are adopting hybrid models that combine the flexibility of remote work with the collaborative benefits of in-person interaction. This balanced approach appears to be gaining popularity as the most practical solution for the future of work.`,
    questions: [
      {
        id: "r1", type: "mcq",
        text: "According to the passage, what has made remote work possible on a large scale?",
        options: [
          "Government regulations",
          "Advances in communication technology",
          "A decrease in office rent prices",
          "New labor laws"
        ],
        correct: 1
      },
      {
        id: "r2", type: "mcq",
        text: "Which of the following is mentioned as a benefit of remote work?",
        options: [
          "Guaranteed promotions",
          "Reduced commuting stress",
          "Free company housing",
          "Unlimited paid leave"
        ],
        correct: 1
      },
      {
        id: "r3", type: "mcq",
        text: "What challenge do managers face with remote teams, according to the text?",
        options: [
          "Difficulty monitoring performance and maintaining culture",
          "Paying higher salaries",
          "Finding enough office space",
          "Training new software"
        ],
        correct: 0
      },
      {
        id: "r4", type: "mcq",
        text: "What solution does the passage suggest is becoming popular?",
        options: [
          "Fully remote work only",
          "Fully in-office work only",
          "Hybrid work models",
          "Four-day work weeks"
        ],
        correct: 2
      },
      {
        id: "r5", type: "matching",
        text: "Quyidagi so'zlarni matndagi ma'nolariga mos qo'ying:",
        pairs: [
          { term: "Proponents", def: "Supporters of an idea" },
          { term: "Cohesion", def: "The state of sticking together as a unit" },
          { term: "Scattered", def: "Spread out over a wide area" }
        ],
        // to'g'ri javob indeks tartibida (aralashtirilgan defs ichidan tanlanadi)
        correctOrder: [0, 1, 2]
      }
    ]
  },
  listening: {
    timeLimit: 12 * 60,
    audioScript: `Good afternoon, and welcome to today's campus tour. My name is Sarah, and I'll be guiding you around the university library. The library is open from eight in the morning until eleven at night on weekdays, and from ten until six on weekends. We have over two million books, as well as a large digital collection you can access with your student card. On the second floor, you'll find the quiet study zone, where talking is not permitted. The third floor has group study rooms that can be booked online up to one week in advance. If you need help finding a resource, the information desk on the ground floor is staffed at all times. Please remember that food is not allowed inside the building, although drinks with a lid are permitted.`,
    questions: [
      {
        id: "l1", type: "mcq",
        text: "What time does the library close on weekdays?",
        options: ["8:00 PM", "11:00 PM", "6:00 PM", "Midnight"],
        correct: 1
      },
      {
        id: "l2", type: "mcq",
        text: "How many books does the library have?",
        options: ["Over one million", "Over two million", "Half a million", "Three million"],
        correct: 1
      },
      {
        id: "l3", type: "mcq",
        text: "What can you NOT do on the second floor?",
        options: ["Read books", "Talk loudly", "Use a laptop", "Sit quietly"],
        correct: 1
      },
      {
        id: "l4", type: "mcq",
        text: "How far in advance can group study rooms be booked?",
        options: ["One day", "Three days", "One week", "One month"],
        correct: 2
      },
      {
        id: "l5", type: "mcq",
        text: "What is allowed inside the building?",
        options: ["Food", "Drinks with a lid", "Pets", "Smoking"],
        correct: 1
      }
    ]
  },
  writing: {
    timeLimit: 25 * 60,
    prompt: `Ba'zi odamlar zamonaviy texnologiyalar ta'lim jarayonini yaxshilayapti, deb hisoblashadi, boshqalari esa bu o'quvchilarning mustaqil fikrlash qobiliyatini pasaytiradi, deb o'ylashadi. Ikkala fikrni ham ko'rib chiqib, o'z fikringizni bildiring. Kamida 250 so'zdan iborat insho yozing.`,
    minWords: 250
  }
};

const CEFR_MAP = [
  { min: 0,  max: 49, level: "A2 yoki undan past", desc: "Test talablariga hali yetarli darajada javob berilmadi." },
  { min: 50, max: 69, level: "B1", desc: "O'rta daraja — kundalik va tanish mavzularda erkin muloqot qila olasiz." },
  { min: 70, max: 89, level: "B2", desc: "Yuqori-o'rta daraja — murakkab matnlarni tushunib, ravon fikr bildira olasiz." },
  { min: 90, max: 100, level: "C1", desc: "Yuqori daraja — til vositalaridan erkin va aniq foydalana olasiz." }
];

/* ==========================================================
   HOLAT (STATE)
   ========================================================== */
let state = {
  screen: "home", // home | reading | listening | writing | speaking | results
  answers: {},    // { questionId: value }
  marked: {},     // { questionId: true }
  currentQ: { reading: 0, listening: 0 },
  timers: {},     // { section: secondsLeft }
  timerInterval: null,
  speaking: {
    recorder: null,
    chunks: [],
    audioURL: null,
    isRecording: false,
    seconds: 0,
    recInterval: null
  },
  ttsUtterance: null,
  isSpeaking: false,
  score: null
};

const app = document.getElementById("app");

/* ==========================================================
   YORDAMCHI FUNKSIYALAR
   ========================================================== */
function fmtTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function startTimer(section, onExpire) {
  clearInterval(state.timerInterval);
  if (state.timers[section] === undefined) {
    state.timers[section] = TEST_DATA[section].timeLimit;
  }
  state.timerInterval = setInterval(() => {
    state.timers[section]--;
    const el = document.getElementById("timer-display");
    if (el) el.textContent = fmtTime(state.timers[section]);
    if (state.timers[section] <= 0) {
      clearInterval(state.timerInterval);
      onExpire();
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(state.timerInterval);
}

function shuffle(arr) {
  return arr.map(v => [Math.random(), v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
}

/* ==========================================================
   SAVOL RENDER (MCQ / MATCHING)
   ========================================================== */
function renderQuestionBody(q) {
  if (q.type === "mcq") {
    const selected = state.answers[q.id];
    return `
    <h3 class="font-bold text-lg mb-4 text-slate-800">${q.text}</h3>
    <div class="space-y-2">
      ${q.options.map((opt, i) => `
        <label class="option-label flex items-center gap-3 border border-slate-200 rounded-lg px-4 py-3 cursor-pointer transition ${selected===i ? "option-selected" : ""}">
          <input type="radio" name="${q.id}" value="${i}" class="mcq-input" ${selected===i ? "checked" : ""}>
          <span class="text-sm text-slate-700">${opt}</span>
        </label>`).join("")}
    </div>`;
  }
  if (q.type === "matching") {
    const shuffledDefs = q._shuffledDefs || (q._shuffledDefs = shuffle(q.pairs.map((p,i)=>({...p, origIndex:i}))));
    const currentAns = state.answers[q.id] || {};
    return `
    <h3 class="font-bold text-lg mb-4 text-slate-800">${q.text}</h3>
    <div class="space-y-3">
      ${q.pairs.map((p, i) => `
        <div class="flex items-center gap-3">
          <div class="w-1/2 text-sm font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">${p.term}</div>
          <select data-term-index="${i}" class="matching-select w-1/2 border border-slate-300 rounded-lg px-2 py-2 text-sm">
            <option value="">-- tanlang --</option>
            ${shuffledDefs.map(d => `<option value="${d.origIndex}" ${currentAns[i]==d.origIndex?"selected":""}>${d.def}</option>`).join("")}
          </select>
        </div>`).join("")}
    </div>`;
  }
  return "";
}

function attachQuestionEvents(q, section) {
  if (q.type === "mcq") {
    document.querySelectorAll(".mcq-input").forEach(inp => {
      inp.onchange = (e) => {
        state.answers[q.id] = parseInt(e.target.value);
        markAnswered(q.id);
        renderSection(section);
      };
    });
  }
  if (q.type === "matching") {
    document.querySelectorAll(".matching-select").forEach(sel => {
      sel.onchange = (e) => {
        const termIndex = parseInt(e.target.dataset.termIndex);
        const val = e.target.value;
        state.answers[q.id] = state.answers[q.id] || {};
        state.answers[q.id][termIndex] = val;
        markAnswered(q.id);
      };
    });
  }
}

function markAnswered(id) {
  const btn = document.getElementById(`qnav-${id}`);
  if (btn) btn.classList.add("answered");
}

/* ==========================================================
   TOP BAR / NAV / QUESTION NAV
   ========================================================== */
function topBar(title, total, qIndex) {
  return `
  <div class="flex items-center justify-between mb-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">${title}</h2>

    </div>

      <span class="text-red-500">⏱</span>
      <span id="timer-display" class="font-mono font-bold text-lg text-slate-800">${fmtTime(state.timers[title.toLowerCase()] ?? TEST_DATA[title.toLowerCase()].timeLimit)}</span>
    </div>
  </div>`;
}

function questionNav(section, questions) {
  return `
  <div class="flex flex-wrap gap-2 my-4">
    ${questions.map((q, i) => `
      <button id="qnav-${q.id}" data-index="${i}" class="qnav-btn q-nav-btn w-9 h-9 rounded-lg border border-slate-300 bg-white text-sm font-medium
        ${state.answers[q.id]!==undefined ? "answered" : ""}
        ${state.marked[q.id] ? "marked" : ""}
        ${i===state.currentQ[section] ? "active" : ""}">
        ${i+1}
      </button>`).join("")}
    <button id="mark-review" class="ml-2 text-xs px-3 py-1 rounded-lg border border-amber-300 text-amber-600 bg-amber-50 hover:bg-amber-100">
      ${state.marked[questions[state.currentQ[section]].id] ? "★ Belgilangan" : "☆ Ko'rib chiqish uchun belgilash"}
    </button>
  </div>`;
}

function navButtons(section, total, qIndex) {
  const isLast = qIndex === total - 1;
  const nextLabel = isLast ? (section === "reading" ? "Listening →" : "Writing →") : "Keyingi →";
  return `
  <div class="flex justify-between mt-4">
    <button id="prev-q" class="px-5 py-2 rounded-lg bg-slate-200 text-slate-600 font-medium disabled:opacity-40" ${qIndex===0?"disabled":""}>← Oldingi</button>
    <button id="next-q" class="px-5 py-2 rounded-lg bg-indigo-600 text-white font-medium">${nextLabel}</button>
  </div>`;
}

function attachNavEvents(section, total) {
  const data = TEST_DATA[section];
  document.querySelectorAll(".qnav-btn").forEach(btn => {
    btn.onclick = () => {
      state.currentQ[section] = parseInt(btn.dataset.index);
      renderSection(section);
    };
  });
  document.getElementById("mark-review").onclick = () => {
    const q = data.questions[state.currentQ[section]];
    state.marked[q.id] = !state.marked[q.id];
    renderSection(section);
  };
  document.getElementById("prev-q").onclick = () => {
    state.currentQ[section] = Math.max(0, state.currentQ[section]-1);
    renderSection(section);
  };
  document.getElementById("next-q").onclick = () => {
    if (state.currentQ[section] < total - 1) {
      state.currentQ[section]++;
      renderSection(section);
    } else {
      stopTimer();
      speechSynthesis.cancel();
      goTo(section === "reading" ? "listening" : "writing");
    }
  };
}

function renderSection(section) {
  if (section === "reading") renderReading();
  if (section === "listening") renderListening();
}

function countWords(text) {

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const sp = state.speaking;
    sp.chunks = [];
    sp.recorder = new MediaRecorder(stream);
    sp.recorder.ondataavailable = (e) => sp.chunks.push(e.data);
    sp.recorder.onstop = () => {
      const blob = new Blob(sp.chunks, { type: "audio/webm" });
      sp.audioURL = URL.createObjectURL(blob);
      stream.getTracks().forEach(t => t.stop());
      renderSpeaking();
    };
    sp.recorder.start();
    sp.isRecording = true;
    sp.seconds = 0;
    sp.recInterval = setInterval(() => {
      sp.seconds++;
      const el = document.getElementById("rec-timer");
      if (el) el.textContent = fmtTime(sp.seconds);
    }, 1000);
    renderSpeaking();
  } catch (err) {
    alert("Mikrofonga ruxsat berilmadi yoki topilmadi: " + err.message);
  }
}

function stopRecording() {
  const sp = state.speaking;
  if (sp.recorder && sp.isRecording) {
    sp.recorder.stop();
    sp.isRecording = false;
    clearInterval(sp.recInterval);
  }
}

/* ==========================================================
   NATIJALARNI HISOBLASH
   ========================================================== */
function calculateScore() {
  let correct = 0;
  let total = 0;

  TEST_DATA.reading.questions.forEach(q => {
    total++;
    if (q.type === "mcq") {
      if (state.answers[q.id] === q.correct) correct++;
    } else if (q.type === "matching") {
      const ans = state.answers[q.id] || {};
      const allCorrect = q.pairs.every((p, i) => parseInt(ans[i]) === i);
      if (allCorrect) correct++;
    }
  });

  TEST_DATA.listening.questions.forEach(q => {
    total++;
    if (state.answers[q.id] === q.correct) correct++;
  });

  const percentage = Math.round((correct / total) * 100);
  const writingWords = countWords(state.answers["writing"] || "");
  const writingBonus = writingWords >= TEST_DATA.writing.minWords ? 0 : -5; // yetarli bo'lmasa kichik jarima
  const finalScore = Math.max(0, Math.min(100, percentage + writingBonus));

  const levelInfo = CEFR_MAP.slice().reverse().find(l => finalScore >= l.min) || CEFR_MAP[0];

  return { correct, total, percentage: finalScore, level: levelInfo, writingWords };
}

function finishTest() {
  stopTimer();
  speechSynthesis.cancel();
  state.score = calculateScore();
  goTo("results");
}

    <div class="grid sm:grid-cols-3 gap-4 max-w-2xl mx-auto mb-10 text-left">

        <div class="text-xs text-slate-400 mb-1">📖 Reading + 🎧 Listening</div>

      </div>

      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-4">
        <div class="text-xs text-slate-400 mb-1">🎤 Speaking</div>

      </div>
    </div>

    <p class="text-xs text-slate-400 mb-4 max-w-md mx-auto">Eslatma: Writing va Speaking bo'limlari avtomatik baholanmaydi — bu bo'limlar odatda inson tekshiruvchisi yoki AI orqali baholanadi. Umumiy CEFR darajasi Reading va Listening natijalari asosida hisoblangan.</p>

    <button id="restart-btn" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-8 py-3 rounded-xl">↺ Testni qayta boshlash</button>
  </div>`;

  document.getElementById("restart-btn").onclick = () => {
    state = {
      screen: "home", answers: {}, marked: {}, currentQ: { reading: 0, listening: 0 },
      timers: {}, timerInterval: null,
      speaking: { recorder: null, chunks: [], audioURL: null, isRecording: false, seconds: 0, recInterval: null },
      ttsUtterance: null, isSpeaking: false, score: null
    };
    goTo("home");
  };
}

/* ==========================================================
   NAVIGATSIYA (ROUTER)
   ========================================================== */
function goTo(screen) {
  state.screen = screen;
  window.scrollTo(0, 0);
  switch (screen) {
    case "home": renderHome(); break;
    case "reading":
      renderReading();
      startTimer("reading", () => goTo("listening"));
      break;
    case "listening":
      renderListening();
      startTimer("listening", () => goTo("writing"));
      break;
    case "writing":
      renderWriting();
      startTimer("writing", () => goTo("speaking"));
      break;
    case "speaking":
      renderSpeaking();
      break;
    case "results":
      renderResults();
      break;
  }
}

try {
  goTo("home");
} catch (err) {
  app.innerHTML = `<div class="p-6 bg-red-50 border border-red-300 rounded-xl text-red-700">
    <b>Xatolik yuz berdi:</b><br>${err.message}<br><pre class="text-xs mt-2 whitespace-pre-wrap">${err.stack || ""}</pre>
  </div>`;
  console.error(err);
}

window.addEventListener("error", (e) => {
  if (app.innerHTML.trim() === "") {
    app.innerHTML = `<div class="p-6 bg-red-50 border border-red-300 rounded-xl text-red-700">
      <b>Xatolik yuz berdi:</b><br>${e.message}
    </div>`;
  }
});
